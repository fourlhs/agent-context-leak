name: tests

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Both developers work on Windows; .gitattributes exists because line-ending
        # handling differs, and the suite has already hit two Windows-only issues.
        # Linux is the cheap default, Windows is the one that catches our bugs.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen fails if uv.lock has drifted from pyproject.toml rather than
      # silently re-resolving. Failing loudly is the point here.
      - run: uv sync --frozen

      - run: uv run pytest -q
